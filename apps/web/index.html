<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XpertiFlow CRM — Omnichannel Suite Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <script>
      (function() {
        var saved = localStorage.getItem('whaticket_theme');
        var isDark = saved !== 'light';
        if (isDark) {
          document.documentElement.setAttribute('data-theme', 'dark');
          if (document.body) document.body.classList.add('body--dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          if (document.body) document.body.classList.add('body--light');
        }
      })();
    </script>
  </head>
  <body class="body--dark">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
