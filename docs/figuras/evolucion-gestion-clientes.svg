<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Evolucion de la gestion de clientes</title>
  <desc id="desc">Evolucion desde registros manuales hasta un CRM conversacional integrado con WhatsApp.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 34px;
        font-weight: 700;
        fill: #172033;
      }
      .subtitle {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-weight: 400;
        fill: #526071;
      }
      .stage-number {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: #ffffff;
      }
      .stage-title {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 23px;
        font-weight: 700;
        fill: #172033;
      }
      .stage-text {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 17px;
        font-weight: 400;
        fill: #526071;
      }
      .icon-stroke {
        fill: none;
        stroke: #26364a;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon-fill {
        fill: #26364a;
      }
      .arrow {
        fill: none;
        stroke: #64748b;
        stroke-width: 4;
        marker-end: url(#arrow);
      }
      .footer {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        fill: #64748b;
      }
    </style>
  </defs>

  <rect width="1600" height="720" fill="#f8fafc"/>

  <text x="800" y="72" text-anchor="middle" class="title">Evolucion de la gestion de clientes</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">De registros aislados a una gestion comercial centralizada y conversacional</text>

  <!-- Flechas de evolucion -->
  <path d="M 405 350 L 485 350" class="arrow"/>
  <path d="M 785 350 L 865 350" class="arrow"/>
  <path d="M 1165 350 L 1245 350" class="arrow"/>

  <!-- Etapa 1 -->
  <g id="etapa-1-registros-manuales">
    <rect x="80" y="175" width="325" height="350" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="80" y="175" width="325" height="12" fill="#9a6b3f"/>
    <circle cx="125" cy="225" r="22" fill="#9a6b3f"/>
    <text x="125" y="231" text-anchor="middle" class="stage-number">1</text>

    <!-- Icono: documento y lapiz -->
    <rect x="194" y="218" width="98" height="116" rx="5" class="icon-stroke"/>
    <path d="M 214 248 L 270 248 M 214 272 L 270 272 M 214 296 L 254 296" class="icon-stroke"/>
    <path d="M 268 312 L 315 265 L 328 278 L 281 325 L 260 332 Z" fill="#f8fafc" stroke="#26364a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 315 265 L 323 257 Q 329 251 335 257 L 341 263 Q 347 269 341 275 L 328 278 Z" class="icon-fill"/>

    <text x="242.5" y="383" text-anchor="middle" class="stage-title">Registros manuales</text>
    <text x="242.5" y="420" text-anchor="middle" class="stage-text">
      <tspan x="242.5" dy="0">Agendas, formularios</tspan>
      <tspan x="242.5" dy="25">y notas en papel</tspan>
    </text>
    <text x="242.5" y="485" text-anchor="middle" class="stage-text">
      <tspan x="242.5" dy="0">Informacion aislada</tspan>
      <tspan x="242.5" dy="25">y dificil de consultar</tspan>
    </text>
  </g>

  <!-- Etapa 2 -->
  <g id="etapa-2-hojas-de-calculo">
    <rect x="460" y="175" width="325" height="350" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="460" y="175" width="325" height="12" fill="#2f7d59"/>
    <circle cx="505" cy="225" r="22" fill="#2f7d59"/>
    <text x="505" y="231" text-anchor="middle" class="stage-number">2</text>

    <!-- Icono: hoja de calculo -->
    <rect x="570" y="218" width="105" height="116" rx="5" class="icon-stroke"/>
    <path d="M 570 252 L 675 252 M 570 280 L 675 280 M 570 308 L 675 308" class="icon-stroke"/>
    <path d="M 605 218 L 605 334 M 640 218 L 640 334" class="icon-stroke"/>
    <rect x="570" y="218" width="105" height="34" rx="4" fill="#2f7d59"/>
    <path d="M 585 231 L 598 243 M 598 231 L 585 243" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <text x="622.5" y="383" text-anchor="middle" class="stage-title">Hojas de calculo</text>
    <text x="622.5" y="420" text-anchor="middle" class="stage-text">
      <tspan x="622.5" dy="0">Listas digitales y</tspan>
      <tspan x="622.5" dy="25">control basico de datos</tspan>
    </text>
    <text x="622.5" y="485" text-anchor="middle" class="stage-text">
      <tspan x="622.5" dy="0">Mejor organizacion,</tspan>
      <tspan x="622.5" dy="25">pero poca trazabilidad</tspan>
    </text>
  </g>

  <!-- Etapa 3 -->
  <g id="etapa-3-crm-tradicional">
    <rect x="840" y="175" width="325" height="350" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="840" y="175" width="325" height="12" fill="#356a9a"/>
    <circle cx="885" cy="225" r="22" fill="#356a9a"/>
    <text x="885" y="231" text-anchor="middle" class="stage-number">3</text>

    <!-- Icono: CRM tradicional -->
    <rect x="946" y="218" width="112" height="88" rx="7" class="icon-stroke"/>
    <path d="M 946 246 L 1058 246" class="icon-stroke"/>
    <circle cx="969" cy="232" r="4" class="icon-fill"/>
    <circle cx="984" cy="232" r="4" class="icon-fill"/>
    <circle cx="999" cy="232" r="4" class="icon-fill"/>
    <circle cx="982" cy="272" r="12" class="icon-stroke"/>
    <path d="M 963 297 Q 982 281 1001 297" class="icon-stroke"/>
    <path d="M 1018 267 L 1040 267 M 1018 282 L 1040 282 M 1018 297 L 1032 297" class="icon-stroke"/>
    <path d="M 1002 306 L 1002 328 M 978 328 L 1026 328" class="icon-stroke"/>

    <text x="1002.5" y="383" text-anchor="middle" class="stage-title">CRM tradicional</text>
    <text x="1002.5" y="420" text-anchor="middle" class="stage-text">
      <tspan x="1002.5" dy="0">Clientes, ventas y</tspan>
      <tspan x="1002.5" dy="25">oportunidades centralizadas</tspan>
    </text>
    <text x="1002.5" y="485" text-anchor="middle" class="stage-text">
      <tspan x="1002.5" dy="0">Procesos estructurados</tspan>
      <tspan x="1002.5" dy="25">y reportes comerciales</tspan>
    </text>
  </g>

  <!-- Etapa 4 -->
  <g id="etapa-4-crm-conversacional">
    <rect x="1220" y="175" width="300" height="350" rx="8" fill="#ffffff" stroke="#87b99b" stroke-width="3"/>
    <rect x="1220" y="175" width="300" height="12" fill="#168c55"/>
    <circle cx="1265" cy="225" r="22" fill="#168c55"/>
    <text x="1265" y="231" text-anchor="middle" class="stage-number">4</text>

    <!-- Icono: CRM + conversacion -->
    <rect x="1312" y="218" width="96" height="78" rx="7" class="icon-stroke"/>
    <path d="M 1312 245 L 1408 245" class="icon-stroke"/>
    <circle cx="1334" cy="267" r="10" class="icon-stroke"/>
    <path d="M 1352 264 L 1390 264 M 1352 280 L 1380 280" class="icon-stroke"/>
    <path d="M 1352 310 C 1352 292 1368 280 1388 280 L 1417 280 C 1438 280 1452 294 1452 312 L 1452 322 C 1452 340 1438 354 1417 354 L 1394 354 L 1377 368 L 1380 354 C 1363 351 1352 339 1352 322 Z" fill="#168c55" stroke="#26364a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 1374 318 C 1377 332 1389 341 1403 341 C 1417 341 1429 332 1432 318" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1383" cy="309" r="3.5" fill="#ffffff"/>
    <circle cx="1423" cy="309" r="3.5" fill="#ffffff"/>

    <text x="1370" y="398" text-anchor="middle" class="stage-title">
      <tspan x="1370" dy="0">CRM conversacional</tspan>
    </text>
    <text x="1370" y="433" text-anchor="middle" class="stage-text">
      <tspan x="1370" dy="0">Gestion comercial</tspan>
      <tspan x="1370" dy="25">integrada con WhatsApp</tspan>
    </text>
    <text x="1370" y="493" text-anchor="middle" class="stage-text">
      <tspan x="1370" dy="0">Historial, seguimiento</tspan>
      <tspan x="1370" dy="25">y atencion en tiempo real</tspan>
    </text>
  </g>

  <!-- Eje temporal -->
  <line x1="105" y1="590" x2="1495" y2="590" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="242" cy="590" r="7" fill="#9a6b3f"/>
  <circle cx="622" cy="590" r="7" fill="#2f7d59"/>
  <circle cx="1002" cy="590" r="7" fill="#356a9a"/>
  <circle cx="1370" cy="590" r="7" fill="#168c55"/>
  <text x="800" y="632" text-anchor="middle" class="footer">Mayor centralizacion, trazabilidad e integracion de la relacion con clientes</text>

  <text x="800" y="688" text-anchor="middle" class="footer">Fuente: elaboracion propia.</text>
</svg>
